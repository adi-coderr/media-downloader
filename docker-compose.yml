version: '3.9'

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: mdp-backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:8080
      - YTDLP_PATH=yt-dlp
      - INSPECT_TIMEOUT_MS=25000
      - DOWNLOAD_MAX_CONCURRENCY=3
      - DOWNLOAD_STAGING_DIR=/app/downloads
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=30
    volumes:
      - downloads-data:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: mdp-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads-data:
